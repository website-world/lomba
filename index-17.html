<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafbf7" />
  <title>SafeBite</title>
  <style>
:root {
  --green: #15953a;
  --green-dark: #087b2c;
  --green-soft: #edf8ef;
  --green-pale: #f4fbf4;
  --text: #121512;
  --muted: #69716a;
  --line: #e7ebe4;
  --surface: #ffffff;
  --bg: #f7f8f4;
  --yellow: #e69b00;
  --yellow-soft: #fff8e8;
  --red: #d93732;
  --red-soft: #fff2f1;
  --blue: #298dc8;
  --shadow: 0 3px 14px rgba(28, 46, 30, 0.07);
  --radius: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: #eef0ea;
  color: var(--text);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { color: inherit; }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.app-shell {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.screen { min-height: 100dvh; padding-bottom: 98px; background: var(--bg); }
.screen.no-nav { padding-bottom: 28px; }

.status-bar {
  height: 32px;
  padding: 8px 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  background: var(--bg);
}
.status-icons { display: flex; align-items: center; gap: 5px; color: #111; }
.signal { display: inline-flex; gap: 1px; align-items: end; height: 10px; }
.signal i { width: 2px; background: currentColor; border-radius: 1px; display: block; }
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}
.wifi { font-size: 12px; transform: translateY(-1px); }
.battery { width: 18px; height: 9px; border: 1.6px solid currentColor; border-radius: 2px; position: relative; }
.battery::before { content:""; position:absolute; inset:1.5px 3px 1.5px 1.5px; background: currentColor; border-radius:1px; }
.battery::after { content:""; position:absolute; right:-3px; top:2px; width:2px; height:4px; background:currentColor; border-radius:0 1px 1px 0; }

.app-header {
  min-height: 58px;
  padding: 8px 18px 10px;
  display: grid;
  grid-template-columns: 42px 1fr 42px;
  align-items: center;
  background: var(--bg);
}
.app-header .title { text-align: center; font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }
.app-header .brand { color: var(--green-dark); font-size: 21px; font-weight: 800; }
.app-header .right { display: flex; justify-content: flex-end; }
.icon-button {
  width: 40px; height: 40px; border: 0; background: transparent; border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.icon-button:hover { background: #eef2ec; }
.icon-button.small { width: 34px; height: 34px; font-size: 28px; font-weight: 300; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.filled { fill: currentColor; }

.content { padding: 0 18px; }
.greeting { margin: 5px 0 13px; }
.greeting h2 { font-size: 16px; margin: 0 0 4px; }
.greeting p { font-size: 12px; color: var(--muted); margin: 0; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.summary-card { padding: 14px; margin-bottom: 18px; }
.card-title { font-size: 14px; font-weight: 700; margin: 0 0 11px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.metric-card {
  min-height: 87px; border: 1px solid #eef0eb; border-radius: 12px; background: #fff;
  padding: 12px 12px 10px;
}
.metric-card .label { font-size: 12px; color: #424942; }
.metric-card .number { font-size: 28px; line-height: 1; margin-top: 8px; font-weight: 500; }
.metric-card .sub { color: var(--muted); font-size: 10.5px; margin-top: 5px; }
.metric-card.safe { background: var(--green-pale); }
.metric-card.safe .number, .metric-card.safe .label { color: var(--green-dark); }
.metric-card.risky { grid-column: span 2; min-height: 86px; color: #fff; border: 0; background: linear-gradient(135deg, #16993d, #138832); position: relative; }
.metric-card.risky .label, .metric-card.risky .sub { color: rgba(255,255,255,.92); }
.metric-card.risky .number { font-size: 27px; }
.metric-card.risky .details-link { position: absolute; right: 12px; bottom: 13px; border: 0; color: #fff; background: rgba(255,255,255,.13); border-radius: 18px; padding: 8px 10px; font-size: 10.5px; cursor: pointer; }

.section-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
.section-heading h3 { font-size: 14px; margin: 0; }
.text-button { color: var(--green-dark); background: none; border: 0; font-size: 12px; font-weight: 600; cursor: pointer; padding: 5px 0; }

.food-list { overflow: hidden; }
.food-row {
  width: 100%; border: 0; border-bottom: 1px solid #edf0eb; background: #fff; padding: 9px 11px;
  display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; text-align: left; cursor: pointer;
}
.food-row:last-child { border-bottom: 0; }
.food-row:hover { background: #fbfcf9; }
.food-thumb { width: 54px; height: 48px; object-fit: cover; border-radius: 10px; background: #f1f3ee; border: 1px solid #edf0ea; }
.food-main { min-width: 0; }
.food-name { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.food-meta { font-size: 10.5px; color: var(--muted); }
.food-score { text-align: right; align-self: stretch; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px; }
.score-number { font-size: 15px; font-weight: 700; white-space: nowrap; }
.score-number small { font-size: 10px; font-weight: 600; }
.status-pill { display: inline-flex; align-items: center; justify-content: center; min-height: 20px; padding: 3px 8px; border-radius: 10px; font-size: 9.5px; font-weight: 650; white-space: nowrap; }
.status-pill.green { color: var(--green-dark); background: #ebf7ed; }
.status-pill.yellow { color: #b77a00; background: #fff7df; }
.status-pill.red { color: #c9302c; background: #fff0ef; }
.location-pill { color: var(--green-dark); background: #eaf7ec; border-radius: 8px; padding: 5px 9px; font-size: 11px; display: inline-block; margin-top: 5px; }

.bottom-nav {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 430px);
  height: 82px;
  background: rgba(255,255,255,.97);
  border-top: 1px solid #e7eae4;
  display: grid;
  grid-template-columns: 1fr 1fr 70px 1fr 1fr;
  align-items: center;
  padding: 5px 11px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter: blur(14px);
}
.nav-item { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #242924; font-size: 9.5px; cursor: pointer; padding: 5px 0; }
.nav-item.active { color: var(--green-dark); font-weight: 700; }
.nav-item .icon { width: 21px; height: 21px; }
.add-button { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #fff; background: var(--green); color: #fff; box-shadow: 0 3px 9px rgba(13,127,44,.26); display: flex; align-items: center; justify-content: center; margin: -24px auto 0; cursor: pointer; }
.add-button .icon { width: 26px; height: 26px; }

.detail-hero { padding: 3px 18px 0; }
.detail-food { padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.detail-food .food-thumb { width: 64px; height: 64px; border-radius: 13px; }
.detail-food .food-name { font-size: 15px; }
.detail-food .food-meta { font-size: 11.5px; margin-top: 4px; }
.score-panel { text-align: center; padding: 24px 12px 6px; }
.score-label { font-size: 14px; margin-bottom: 11px; }
.score-big { color: var(--green); font-weight: 700; font-size: 43px; line-height: 1; letter-spacing: -1.8px; }
.score-big small { font-size: 29px; font-weight: 600; }
.score-status { color: var(--green-dark); font-size: 14px; font-weight: 700; margin-top: 16px; display:flex; align-items:center; justify-content:center; gap:8px; }
.score-status .icon { width: 22px; height: 22px; }
.chart-wrap { margin: 14px 0 0; }
.chart-svg { width: 100%; height: 145px; overflow: visible; }
.chart-grid { stroke: #e8ece7; stroke-width: 1; }
.chart-line { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart-dot { fill: var(--green); }
.chart-text { font-size: 8px; fill: #6d746e; font-family: inherit; }
.sensor-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 8px 0 0; padding: 12px 4px; }
.sensor-item { display:flex; gap:8px; justify-content:center; align-items:center; border-right:1px solid #edf0eb; }
.sensor-item:last-child { border-right:0; }
.sensor-icon.green { color: var(--green); }.sensor-icon.blue { color:#2a9ad5; }
.sensor-copy span { display:block; font-size:9px; color: var(--muted); margin-bottom:4px; }
.sensor-copy strong { font-size:13px; }
.recommend-card { margin-top: 14px; padding: 14px; display: grid; grid-template-columns: 37px 1fr; gap: 11px; align-items: start; }
.recommend-card .shield-box { width: 36px; height: 36px; border-radius: 10px; background: var(--green); color:#fff; display:flex; align-items:center; justify-content:center; }
.recommend-card h4 { margin:0 0 4px; font-size:13px; }
.recommend-card p { margin:0; font-size:11px; color:#4f5750; line-height:1.55; }
.action-row { margin-top: 14px; width:100%; padding: 15px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); background:#fff; border-radius:14px; box-shadow:var(--shadow); cursor:pointer; }
.action-left { display:flex; align-items:center; gap:11px; font-size:13px; font-weight:600; }

.inventory-tabs { padding: 0 18px; display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid #e6eae4; }
.tab-button { background:transparent; border:0; padding:10px 4px 12px; font-size:11.5px; color:#747a74; position:relative; cursor:pointer; }
.tab-button.active { color:#121512; font-weight:700; }
.tab-button.active::after { content:""; position:absolute; bottom:-1px; left:8px; right:8px; height:2px; background:var(--green); border-radius:2px; }
.inventory-list { margin: 12px 18px 0; }
.inventory-list .food-row { padding: 12px 11px; }
.inventory-list .food-thumb { width:58px; height:50px; }
.empty-state { padding: 50px 24px; text-align:center; color:var(--muted); }

.notification-content { padding: 3px 18px 0; }
.notification-section-title { font-size:12px; color:var(--red); font-weight:700; margin: 8px 0 10px; }
.notification-section-title.info { color:#303530; margin-top:18px; }
.notification-card { padding: 13px; display:grid; grid-template-columns:28px minmax(0,1fr) auto; column-gap:12px; row-gap:8px; margin-bottom:9px; align-items:start; }
.notification-card.alert-red { background:#fff8f7; border-color:#f2dedc; }
.notification-card.alert-yellow { background:#fffdf8; }
.notification-icon { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.notification-icon.red { color:#fff; background:var(--red); }
.notification-icon.yellow { color:#fff; background:var(--yellow); }
.notification-icon.neutral { color:#4a524b; background:#edf0ec; }
.notification-icon.green { color:#fff; background:var(--green); }
.notification-title { font-size:12.5px; font-weight:700; margin:0 0 4px; }
.notification-title.red { color:#c8322f; }.notification-title.yellow { color:#bd7a00; }.notification-title.green { color:var(--green-dark); }
.notification-copy { font-size:10.5px; line-height:1.5; color:#414841; margin:0; }
.notification-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 7px;
  text-align: left;
}
.notification-title {
  display: block;
  margin: 0;
  line-height: 1.35;
}
.notification-copy {
  display: block;
  margin: 0;
  line-height: 1.55;
}
.notification-time {
  display: block;
  margin-left: 5px;
  padding-top: 2px;
  font-size:9px;
  color:#8b918c;
  white-space:nowrap;
}
.notification-card.read { opacity:.58; box-shadow:none; }

.recommend-page { padding: 4px 18px 24px; }
.recommend-intro { padding: 15px 14px 10px; background:linear-gradient(180deg,#effaef,#fff); margin-bottom:12px; overflow:hidden; }
.recommend-intro h2 { font-size:15px; margin:0 0 8px; }
.recommend-intro p { font-size:11.5px; line-height:1.55; margin:0 0 8px; color:#454c46; }
.recommend-illustration { width:100%; height:82px; object-fit:cover; border-radius:10px; mix-blend-mode:multiply; }
.recommend-option { padding:13px 12px; display:grid; grid-template-columns:38px 1fr 18px; gap:11px; align-items:center; margin-bottom:9px; cursor:pointer; transition:.18s ease; }
.recommend-option:hover, .recommend-option.selected { transform:translateY(-1px); border-color:#cfe7d4; box-shadow:0 7px 18px rgba(29,76,38,.10); }
.option-icon { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.option-icon.green { background:#e7f5e8; color:var(--green-dark); }
.option-icon.yellow { background:#fff3d7; color:#b77700; }
.option-icon.blue { background:#e5f2fa; color:#207aa8; }
.option-icon.red { background:#ffe8e6; color:#c9302c; }
.option-title { font-size:13px; font-weight:700; margin-bottom:3px; }
.option-copy { font-size:10.5px; color:#5d655e; line-height:1.45; }
.impact-banner { margin-top:12px; border-radius:14px; background:linear-gradient(135deg,#249c48,#16863a); color:#fff; text-align:center; padding:14px 18px; font-size:11px; line-height:1.6; box-shadow:0 7px 18px rgba(22,134,58,.19); }
.impact-banner strong { display:block; margin-bottom:2px; }

.profile-page { padding: 2px 18px 24px; }
.profile-card { padding:12px; display:grid; grid-template-columns:58px 1fr 18px; gap:12px; align-items:center; }
.avatar { width:58px; height:58px; border-radius:50%; object-fit:cover; border:1px solid #dbe5d9; }
.profile-name { display:block; font-size:14px; font-weight:700; }
.profile-email { display:block; margin-top:7px; font-size:10.5px; color:#6b716c; }
.group-title { margin:18px 0 9px; font-size:12px; font-weight:700; }
.settings-card { overflow:hidden; }
.settings-row { width:100%; min-height:43px; border:0; border-bottom:1px solid #edf0eb; background:#fff; display:grid; grid-template-columns:25px 1fr auto; align-items:center; text-align:left; padding:7px 12px; font-size:11.5px; cursor:pointer; }
.settings-row:last-child { border-bottom:0; }
.settings-row:hover { background:#fbfcfa; }
.settings-row .icon { width:17px; height:17px; }
.connected { display:flex; align-items:center; gap:7px; font-size:10px; color:#3d453e; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--green); }
.add-device { color:var(--green-dark); font-weight:600; }
.add-device .icon { width:17px; height:17px; }
.setting-value { font-size:10px; color:#777e78; display:flex; gap:5px; align-items:center; }
.logout-button { margin-top:24px; width:100%; height:47px; background:#fff; border:1px solid #e4e8e2; border-radius:14px; color:#c8322f; font-size:12px; cursor:pointer; box-shadow:var(--shadow); }

.modal { position:fixed; inset:0; z-index:100; pointer-events:none; opacity:0; transition:opacity .2s ease; }
.modal.open { opacity:1; pointer-events:auto; }
.modal-backdrop { position:absolute; inset:0; background:rgba(13,18,14,.38); backdrop-filter:blur(2px); }
.modal-sheet { position:absolute; left:50%; bottom:0; transform:translate(-50%, 110%); width:min(100%,430px); max-height:88vh; overflow:auto; background:#fff; border-radius:24px 24px 0 0; padding:10px 18px calc(24px + env(safe-area-inset-bottom)); transition:transform .28s cubic-bezier(.2,.8,.2,1); }
.modal.open .modal-sheet { transform:translate(-50%,0); }
.modal-grabber { width:46px; height:5px; border-radius:4px; background:#dfe3dd; margin:0 auto 12px; }
.modal-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.modal-heading h2 { margin:0; font-size:18px; }
.form-grid { display:grid; gap:12px; }
.form-label { display:grid; gap:6px; font-size:11px; color:#505851; font-weight:600; }
.form-control { width:100%; height:45px; border:1px solid #dfe5dd; border-radius:12px; padding:0 12px; background:#fbfcfa; color:#161a16; outline:none; }
.form-control:focus { border-color:#91c99d; box-shadow:0 0 0 3px #eaf6ed; }
.primary-button { width:100%; height:48px; border:0; border-radius:13px; background:var(--green); color:#fff; font-weight:700; cursor:pointer; margin-top:4px; }

.toast { position:fixed; left:50%; bottom:98px; transform:translate(-50%,20px); width:min(calc(100% - 36px),394px); padding:12px 15px; background:#172019; color:#fff; border-radius:13px; font-size:12px; text-align:center; opacity:0; pointer-events:none; z-index:120; transition:.22s ease; box-shadow:0 8px 28px rgba(0,0,0,.2); }
.toast.show { opacity:1; transform:translate(-50%,0); }

@media (min-width: 600px) {
  body { padding: 28px 0; }
  .app-shell { min-height: 850px; height: min(880px, calc(100vh - 56px)); border-radius: 40px; box-shadow:0 18px 60px rgba(24,35,26,.18); border:8px solid #0c0f0d; overflow:auto; scrollbar-width:none; }
  .app-shell::-webkit-scrollbar { display:none; }
  .screen { min-height:100%; }
  .bottom-nav { width:414px; bottom:28px; border-radius:0 0 32px 32px; }
  .modal-sheet { bottom:28px; border-radius:24px; }
}

@media (max-width: 360px) {
  .content, .detail-hero, .notification-content, .recommend-page, .profile-page { padding-left:13px; padding-right:13px; }
  .app-header { padding-left:10px; padding-right:10px; }
  .food-row { grid-template-columns:48px 1fr auto; gap:7px; padding-left:8px; padding-right:8px; }
  .food-thumb { width:48px; height:45px; }
}


/* =========================================================
   Responsive layout system — phones, tablets and desktops
   ========================================================= */
html { width: 100%; min-height: 100%; }
body { width: 100%; min-height: 100dvh; overflow-x: hidden; }
img, svg { max-width: 100%; }
button, input, select { min-width: 0; }
button { touch-action: manipulation; }
.food-name, .food-meta, .notification-copy, .option-copy, .profile-email,
.settings-row span, .recommend-card p { overflow-wrap: anywhere; }
.app-shell { isolation: isolate; }
.screen { width: 100%; }
.content, .detail-hero, .notification-content, .recommend-page, .profile-page {
  width: 100%;
  margin-inline: auto;
}
.icon-button, .nav-item, .settings-row, .tab-button, .text-button,
.food-row, .recommend-option, .action-row, .profile-card { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid rgba(21,149,58,.28); outline-offset: 2px; }

/* Very small and narrow phones */
@media (max-width: 359px) {
  .app-header { grid-template-columns: 38px minmax(0,1fr) 38px; }
  .app-header .title { font-size: 15px; }
  .app-header .brand { font-size: 19px; }
  .status-bar { padding-inline: 13px; }
  .summary-card { padding: 11px; }
  .summary-grid { gap: 7px; }
  .metric-card { padding: 10px; }
  .metric-card .number { font-size: 24px; }
  .food-score { gap: 3px; }
  .score-number { font-size: 13px; }
  .status-pill { padding-inline: 6px; font-size: 8.5px; }
  .bottom-nav { grid-template-columns: 1fr 1fr 62px 1fr 1fr; padding-inline: 5px; }
  .nav-item { font-size: 8.5px; }
  .add-button { width: 48px; height: 48px; }
  .sensor-grid { grid-template-columns: 1fr; gap: 0; padding: 0; }
  .sensor-item { justify-content:flex-start; padding: 12px; border-right: 0; border-bottom: 1px solid #edf0eb; }
  .sensor-item:last-child { border-bottom: 0; }
}

/* Tablets and landscape phones: use the available canvas, no phone frame */
@media (min-width: 600px) {
  body { padding: 0; background: var(--bg); }
  .app-shell {
    width: 100%; max-width: none; height: 100dvh; min-height: 100dvh;
    margin: 0; border: 0; border-radius: 0; box-shadow: none;
    overflow-x: hidden; overflow-y: auto; scrollbar-width: thin;
  }
  .app-shell::-webkit-scrollbar { display: initial; width: 8px; }
  .app-shell::-webkit-scrollbar-thumb { background: #d9ded7; border-radius: 8px; }
  .screen { min-height: 100dvh; }
  .content, .detail-hero, .notification-content, .recommend-page, .profile-page {
    max-width: 1180px;
    padding-left: clamp(24px, 4vw, 52px);
    padding-right: clamp(24px, 4vw, 52px);
  }
  .app-header {
    min-height: 68px;
    padding: 11px clamp(24px, 4vw, 52px);
    position: sticky; top: 0; z-index: 12;
    background: rgba(247,248,244,.92);
    border-bottom: 1px solid rgba(220,226,218,.8);
    backdrop-filter: blur(16px);
  }
  .app-header .title { font-size: clamp(18px, 2.3vw, 23px); }
  .app-header .brand { font-size: clamp(23px, 3vw, 29px); }
  .status-bar { display: none; }
  .bottom-nav {
    left: 0; transform: none; bottom: 0; width: 100%; height: 84px;
    border-radius: 0; padding-inline: clamp(18px, 7vw, 110px);
  }
  .modal-sheet {

const app = document.getElementById('app');

function icon(name, className = '') {
  return `<svg class="icon ${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
}

function statusBar() {
  return `
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="wifi">⌁</span>
        <span class="battery"></span>
      </div>
    </div>`;
}

function header({ title = '', brand = false, back = false, leftAction = 'menu', rightAction = null, rightIcon = null } = {}) {
  const left = back
    ? `<button class="icon-button" data-action="back" aria-label="Kembali">${icon('back')}</button>`
    : `<button class="icon-button" data-action="${leftAction}" aria-label="Menu">${icon('menu')}</button>`;
  const right = rightIcon
    ? `<button class="icon-button" data-action="${rightAction || rightIcon}" aria-label="${rightAction || rightIcon}">${icon(rightIcon)}</button>`
    : `<span></span>`;
  return `
    <header class="app-header">
      <div>${left}</div>
      <h1 class="title ${brand ? 'brand' : ''}">${title}</h1>
      <div class="right">${right}</div>
    </header>`;
}

function bottomNav(active) {
  const items = [
    ['home', 'home', 'Beranda'],
    ['inventory', 'inventory', 'Inventori'],
    ['add', 'plus', 'Tambah'],
    ['notifications', 'bell', 'Notifikasi'],
    ['profile', 'user', 'Profil']
  ];
  return `<nav class="bottom-nav" aria-label="Navigasi utama">
    ${items.map(([screen, iconName, label]) => {
      if (screen === 'add') return `<button class="add-button" data-action="open-add-food" aria-label="Tambah makanan">${icon(iconName)}</button>`;
      return `<button class="nav-item ${active === screen ? 'active' : ''}" data-screen="${screen}">${icon(iconName)}<span>${label}</span></button>`;
    }).join('')}
  </nav>`;
}

function foodRow(food) {
  return `
    <button class="food-row" data-food-id="${food.id}">
      <img class="food-thumb" src="${food.image}" alt="${food.name}" />
      <div class="food-main">
        <div class="food-name">${food.name}</div>
        <div class="food-meta">${food.days === 1 ? 'Disimpan 1 hari' : `Disimpan ${food.days} hari`}</div>
      </div>
      <div class="food-score">
        <div class="score-number">${food.score}<small>/100</small></div>
        <span class="status-pill ${food.tone}">${food.status}</span>
      </div>
    </button>`;
}

function detailScreen() {
  const food = foods.find(item => item.id === state.selectedFoodId) || foods[0];
  const chartValues = [62, 70, 81, 69, 66, 72, 64, 69, 75, Math.min(96, food.score)];
  const chartPointData = chartValues.map((value, index) => ({
    x: (index / (chartValues.length - 1)) * 100,
    y: 100 - value
  }));
  const points = chartPointData.map(point => `${point.x * 10},${point.y * 1.8}`).join(' ');
  const scoreColor = food.tone === 'red' ? '#d93732' : food.tone === 'yellow' ? '#d18a00' : '#15953a';
  return `
    <section class="screen no-nav detail-screen">
      ${statusBar()}
      ${header({ title: 'Detail Makanan', back: true, rightAction: 'more-detail', rightIcon: 'more' })}
      <div class="detail-hero">
        <div class="detail-food card">
          <img class="food-thumb" src="${food.image}" alt="${food.name}" />
          <div>
            <div class="food-name">${food.name}</div>
            <div class="food-meta">${food.days === 1 ? 'Disimpan 1 hari' : `Disimpan ${food.days} hari`}</div>
            <span class="location-pill">Di ${food.location}</span>
          </div>
        </div>

        <div class="score-panel">
          <div class="score-label">Freshness Score</div>
          <div class="score-big" style="color:${scoreColor}">${food.score}<small>/100</small></div>
          <div class="score-status" style="color:${scoreColor}">${food.status} ${icon('smile')}</div>
          <div class="chart-wrap">
            <div class="fullwidth-chart" aria-label="Grafik kesegaran">
              <div class="chart-y-axis" aria-hidden="true">
                <span>100</span><span>75</span><span>50</span><span>25</span><span>0</span>
              </div>
              <div class="chart-main">
                <div class="chart-plot-area">
                  <svg class="chart-svg" viewBox="0 0 1000 180" preserveAspectRatio="none" role="img" aria-label="Freshness Score selama lima hari">
                    <line class="chart-grid" x1="0" y1="0" x2="1000" y2="0"/>
                    <line class="chart-grid" x1="0" y1="45" x2="1000" y2="45"/>
                    <line class="chart-grid" x1="0" y1="90" x2="1000" y2="90"/>
                    <line class="chart-grid" x1="0" y1="135" x2="1000" y2="135"/>
                    <line class="chart-grid" x1="0" y1="180" x2="1000" y2="180"/>
                    <polyline class="chart-line" vector-effect="non-scaling-stroke" points="${points}" style="stroke:${scoreColor}"/>
                  </svg>
                  ${chartPointData.map(point => `<span class="chart-point" style="left:${point.x}%;top:${point.y}%;background:${scoreColor}"></span>`).join('')}
                </div>
                <div class="chart-x-axis" aria-hidden="true">
                  <span>18/07</span><span>19/07</span><span>20/07</span><span>21/07</span><span>Hari ini</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="sensor-grid card">
          <div class="sensor-item"><span class="sensor-icon green">${icon('thermometer')}</span><div class="sensor-copy"><span>Suhu</span><strong>${food.temperature}</strong></div></div>
          <div class="sensor-item"><span class="sensor-icon blue">${icon('droplet')}</span><div class="sensor-copy"><span>Kelembapan</span><strong>${food.humidity}</strong></div></div>
          <div class="sensor-item"><span>${icon('wave')}</span><div class="sensor-copy"><span>VOC</span><strong>${food.voc}</strong></div></div>
        </div>

        <button class="recommend-card card" data-screen="recommendations">
          <span class="shield-box">${icon('shield')}</span>
          <span style="text-align:left"><h4>Rekomendasi</h4><p>${food.score >= 70 ? 'Aman dikonsumsi. Konsumsi sebelum 23 Juli 2026.' : 'Segera masak, bekukan, atau buang jika kondisi visual memburuk.'}</p></span>
        </button>
        <button class="action-row" data-action="history"><span class="action-left">${icon('history')} Riwayat</span>${icon('chevron')}</button>
      </div>
    </section>`;
}

function inventoryScreen() {
  const tabs = ['Semua', 'Kulkas', 'Freezer', 'Pantry'];
  const filtered = state.inventoryTab === 'Semua' ? foods.slice(0, 6) : foods.filter(food => food.location === state.inventoryTab);
  return `
    <section class="screen inventory-screen">
      ${statusBar()}
      ${header({ title: 'Inventori', rightAction: 'filter', rightIcon: 'filter' })}
      <div class="inventory-tabs">
        ${tabs.map(tab => `<button class="tab-button ${state.inventoryTab === tab ? 'active' : ''}" data-inventory-tab="${tab}">${tab}</button>`).join('')}

      <div class="inventory-list food-list card">
        ${filtered.length ? filtered.map(foodRow).join('') : `<div class="empty-state">Belum ada makanan di ${state.inventoryTab}.</div>`}
      </div>
      ${bottomNav('inventory')}
    </section>`;
}

function notificationCard(item) {
  return `<button class="notification-card card ${item.section === 'important' ? `alert-${item.tone}` : ''} ${item.read ? 'read' : ''}" data-notification-id="${item.id}">

    <span class="notification-body"><span class="notification-title ${item.tone}">${item.title}</span><span class="notification-copy">${item.copy}</span></span>
    <span class="notification-time">${item.time}</span>
  </button>`;
}

function render() {
  const screens = {
    home: homeScreen,
    detail: detailScreen,
    inventory: inventoryScreen,
    notifications: notificationsScreen,
    recommendations: recommendationsScreen,
    profile: profileScreen
  };
  app.innerHTML = (screens[state.screen] || homeScreen)();
  app.scrollTop = 0;
}

function navigate(screen) {
  if (state.screen !== screen) state.previousScreen = state.screen;
  state.screen = screen;
  render();
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

function openModal(title, html) {
  modalTitle.textContent = title;
  modalContent.innerHTML = html;
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}

app.addEventListener('click', event => {
  const screenButton = event.target.closest('[data-screen]');
  if (screenButton) {
    navigate(screenButton.dataset.screen);
    return;
  }

  const foodButton = event.target.closest('[data-food-id]');
  if (foodButton) {
    state.selectedFoodId = foodButton.dataset.foodId;
    navigate('detail');
    return;
  }

  const tab = event.target.closest('[data-inventory-tab]');
  if (tab) {
    state.inventoryTab = tab.dataset.inventoryTab;
    render();
    return;
  }

  const recommendation = event.target.closest('[data-recommendation]');
  if (recommendation) {
    state.selectedRecommendation = recommendation.dataset.recommendation;
    const labels = { eat: 'Segera Dikonsumsi', cook: 'Masak Sekarang', freeze: 'Bekukan', discard: 'Buang' };
    render();
    showToast(`Pilihan “${labels[state.selectedRecommendation]}” disimpan.`);
    return;
  }

  const notification = event.target.closest('[data-notification-id]');
  if (notification) {
    const item = notifications.find(n => n.id === Number(notification.dataset.notificationId));
    item.read = !item.read;
    render();
    showToast(item.read ? 'Notifikasi ditandai sudah dibaca.' : 'Notifikasi ditandai belum dibaca.');
    return;
  }

  const actionButton = event.target.closest('[data-action]');
  if (!actionButton) return;
  const action = actionButton.dataset.action;
  if (action === 'back') {
    navigate(state.previousScreen === 'detail' && state.screen === 'recommendations' ? 'detail' : 'home');
  } else if (action === 'menu') {
    showToast('Menu SafeBite');
  } else if (action === 'go-notifications') {
    navigate('notifications');
  } else if (action === 'open-add-food') {
    addFoodModal();
  } else if (action === 'open-add-device') {
    addDeviceModal();
  } else if (action === 'mark-all-read') {
    notifications.forEach(n => n.read = true);
    render();
    showToast('Semua notifikasi ditandai sudah dibaca.');
  } else if (action === 'filter') {
    showToast('Pilih lokasi melalui tab Inventori.');
  } else if (action === 'history') {
    showToast('Riwayat sensor 7 hari ditampilkan pada grafik.');
  } else if (action === 'more-detail') {
    showToast('Opsi detail makanan');
  } else if (action === 'logout') {
    showToast('Mode demo: akun tetap aktif.');
  } else if (action.startsWith('setting-') || action === 'edit-profile') {
    showToast('Pengaturan demo siap digunakan.');
  }
});
