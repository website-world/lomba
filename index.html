<div id="modal" class="modal" aria-hidden="true"><div class="modal-backdrop" data-close-modal></div><section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-grabber"></div><div class="modal-heading"><h2 id="modal-title"></h2><button class="icon-button small" data-close-modal aria-label="Tutup">×</button></div><div id="modal-content"></div></section></div>
<div id="toast" class="toast" role="status"></div>
<script>
const makeImage=(name,c1,c2)=>`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="160" height="120" rx="20" fill="url(#g)"/><circle cx="80" cy="49" r="24" fill="rgba(255,255,255,.68)"/><path d="M68 47c8-9 16-9 24 0-3 13-21 13-24 0Z" fill="rgba(30,80,38,.45)"/><text x="80" y="96" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="rgba(20,45,24,.75)">${name}</text></svg>`)}`;
const foods=[
{id:'beef',name:'Daging Sapi',score:92,days:1,location:'Kulkas',image:makeImage('Daging Sapi','#ead6cf','#c69681'),status:'Sangat Segar',tone:'green',temperature:'4.2°C',humidity:'72%',voc:'Rendah'},
{id:'chicken',name:'Ayam',score:65,days:2,location:'Kulkas',image:makeImage('Ayam','#f3dfc5','#d3ab79'),status:'Segar',tone:'yellow',temperature:'4.5°C',humidity:'70%',voc:'Sedang'},
{id:'milk',name:'Susu',score:88,days:3,location:'Kulkas',image:makeImage('Susu','#edf5ff','#b9d5f1'),status:'Segar',tone:'green',temperature:'3.8°C',humidity:'68%',voc:'Rendah'},
{id:'strawberry',name:'Stroberi',score:45,days:1,location:'Kulkas',image:makeImage('Stroberi','#ffd8df','#ec7f93'),status:'Berisiko',tone:'red',temperature:'5.1°C',humidity:'76%',voc:'Tinggi'},
{id:'spinach',name:'Sayur Bayam',score:70,days:2,location:'Kulkas',image:makeImage('Bayam','#d8efd8','#83ba83'),status:'Segar',tone:'yellow',temperature:'4.4°C',humidity:'74%',voc:'Sedang'},
{id:'rice',name:'Nasi Putih',score:90,days:1,location:'Freezer',image:makeImage('Nasi Putih','#fffdf5','#ddd6c0'),status:'Sangat Segar',tone:'green',temperature:'-17°C',humidity:'61%',voc:'Rendah'},
{id:'salmon',name:'Salmon',score:78,days:1,location:'Freezer',image:makeImage('Salmon','#ffe4dd','#ed9c8f'),status:'Segar',tone:'green',temperature:'-16°C',humidity:'64%',voc:'Rendah'},
{id:'broccoli',name:'Brokoli',score:95,days:1,location:'Kulkas',image:makeImage('Brokoli','#e3f3df','#8abf79'),status:'Sangat Segar',tone:'green',temperature:'4.0°C',humidity:'71%',voc:'Rendah'}];
const notifications=[{id:1,section:'important',icon:'warning',tone:'red',title:'Daging Sapi berisiko!',copy:'Freshness score 45/100. Sebaiknya segera dimasak atau dibekukan.',time:'08:30',read:false},{id:2,section:'important',icon:'warning',tone:'yellow',title:'Stroberi hampir tidak segar',copy:'Freshness score 40/100. Konsumsi dalam 1 hari.',time:'Kemarin',read:false},{id:3,section:'info',icon:'info',tone:'green',title:'Susu masih aman',copy:'Freshness score 88/100.',time:'Kemarin',read:false},{id:4,section:'info',icon:'history',tone:'neutral',title:'Inventori diperbarui',copy:'Data inventori telah diperbarui.',time:'20 Jul',read:false},{id:5,section:'info',icon:'device',tone:'green',title:'Perangkat terhubung',copy:'Wadah Kulkas Utama terhubung.',time:'20 Jul',read:false}];
const state={screen:'home',previousScreen:'home',selectedFoodId:'beef',inventoryTab:'Semua',selectedRecommendation:null,devices:['Kulkas Utama','Kulkas 2','Freezer']};
const app=document.getElementById('app'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modal-title'),modalContent=document.getElementById('modal-content'),toast=document.getElementById('toast');let toastTimer;
const icon=(name,className='')=>`<svg class="icon ${className}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
function statusBar(){return `<div class="status-bar"><span>9:41</span><div class="status-icons" aria-hidden="true"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi">⌁</span><span class="battery"></span></div></div>`}
function header({title='',brand=false,back=false,leftAction='menu',rightAction=null,rightIcon=null}={}){const left=back?`<button class="icon-button" data-action="back" aria-label="Kembali">${icon('back')}</button>`:`<button class="icon-button" data-action="${leftAction}" aria-label="Menu">${icon('menu')}</button>`;const right=rightIcon?`<button class="icon-button" data-action="${rightAction||rightIcon}" aria-label="${rightAction||rightIcon}">${icon(rightIcon)}</button>`:`<span></span>`;return `<header class="app-header"><div>${left}</div><h1 class="title ${brand?'brand':''}">${title}</h1><div class="right">${right}</div></header>`}
function bottomNav(active){const items=[['home','home','Beranda'],['inventory','inventory','Inventori'],['add','plus','Tambah'],['notifications','bell','Notifikasi'],['profile','user','Profil']];return `<nav class="bottom-nav" aria-label="Navigasi utama">${items.map(([screen,iconName,label])=>screen==='add'?`<button class="add-button" data-action="open-add-food" aria-label="Tambah makanan">${icon(iconName)}</button>`:`<button class="nav-item ${active===screen?'active':''}" data-screen="${screen}">${icon(iconName)}<span>${label}</span></button>`).join('')}</nav>`}
function foodRow(food){return `<button class="food-row" data-food-id="${food.id}"><img class="food-thumb" src="${food.image}" alt="${food.name}"/><div class="food-main"><div class="food-name">${food.name}</div><div class="food-meta">${food.days===1?'Disimpan 1 hari':`Disimpan ${food.days} hari`}</div></div><div class="food-score"><div class="score-number">${food.score}<small>/100</small></div><span class="status-pill ${food.tone}">${food.status}</span></div></button>`}
function homeScreen(){const homeFoods=[foods[0],foods[6],foods[7]];return `<section class="screen home-screen">${statusBar()}${header({title:'',brand:false,rightAction:'go-notifications',rightIcon:'bell'})}<div class="content"><div class="greeting"><h2>Hai, Ahsan!</h2><p>Yuk, cek kesegaran makananmu hari ini.</p></div><section class="summary-card card"><h3 class="card-title">Ringkasan Hari Ini</h3><div class="summary-grid"><div class="metric-card"><div class="label">Wadah Aktif</div><div class="number">6</div><div class="sub">Total terhubung</div></div><div class="metric-card safe"><div class="label">Makanan Aman</div><div class="number">4</div><div class="sub">Aman dikonsumsi</div></div><div class="metric-card risky"><div class="label">Makanan Berisiko</div><div class="number">2</div><div class="sub">Perlu perhatian</div><button class="details-link" data-screen="inventory">Lihat Detail&nbsp; ›</button></div></div></section><div class="section-heading"><h3>Makananmu</h3><button class="text-button" data-screen="inventory">Lihat Semua</button></div><div class="food-list card">${homeFoods.map(foodRow).join('')}</div></div>${bottomNav('home')}</section>`}
function detailScreen(){const food=foods.find(i=>i.id===state.selectedFoodId)||foods[0],chartValues=[62,70,81,69,66,72,64,69,75,Math.min(96,food.score)],chartPointData=chartValues.map((v,i)=>({x:i/(chartValues.length-1)*100,y:100-v})),points=chartPointData.map(p=>`${p.x*10},${p.y*1.8}`).join(' '),scoreColor=food.tone==='red'?'#d93732':food.tone==='yellow'?'#d18a00':'#15953a';return `<section class="screen no-nav detail-screen">${statusBar()}${header({title:'Detail Makanan',back:true,rightAction:'more-detail',rightIcon:'more'})}<div class="detail-hero"><div class="detail-food card"><img class="food-thumb" src="${food.image}" alt="${food.name}"/><div><div class="food-name">${food.name}</div><div class="food-meta">${food.days===1?'Disimpan 1 hari':`Disimpan ${food.days} hari`}</div><span class="location-pill">Di ${food.location}</span></div></div><div class="score-panel"><div class="score-label">Freshness Score</div><div class="score-big" style="color:${scoreColor}">${food.score}<small>/100</small></div><div class="score-status" style="color:${scoreColor}">${food.status} ${icon('smile')}</div><div class="chart-wrap"><div class="fullwidth-chart" aria-label="Grafik kesegaran"><div class="chart-y-axis" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><div class="chart-main"><div class="chart-plot-area"><svg class="chart-svg" viewBox="0 0 1000 180" preserveAspectRatio="none" role="img" aria-label="Freshness Score selama lima hari"><line class="chart-grid" x1="0" y1="0" x2="1000" y2="0"/><line class="chart-grid" x1="0" y1="45" x2="1000" y2="45"/><line class="chart-grid" x1="0" y1="90" x2="1000" y2="90"/><line class="chart-grid" x1="0" y1="135" x2="1000" y2="135"/><line class="chart-grid" x1="0" y1="180" x2="1000" y2="180"/><polyline class="chart-line" vector-effect="non-scaling-stroke" points="${points}" style="stroke:${scoreColor}"/></svg>${chartPointData.map(p=>`<span class="chart-point" style="left:${p.x}%;top:${p.y}%;background:${scoreColor}"></span>`).join('')}</div><div class="chart-x-axis" aria-hidden="true"><span>18/07</span><span>19/07</span><span>20/07</span><span>21/07</span><span>Hari ini</span></div></div></div></div></div><div class="sensor-grid card"><div class="sensor-item"><span class="sensor-icon green">${icon('thermometer')}</span><div class="sensor-copy"><span>Suhu</span><strong>${food.temperature}</strong></div></div><div class="sensor-item"><span class="sensor-icon blue">${icon('droplet')}</span><div class="sensor-copy"><span>Kelembapan</span><strong>${food.humidity}</strong></div></div><div class="sensor-item"><span>${icon('wave')}</span><div class="sensor-copy"><span>VOC</span><strong>${food.voc}</strong></div></div></div><button class="recommend-card card" data-screen="recommendations"><span class="shield-box">${icon('shield')}</span><span style="text-align:left"><h4>Rekomendasi</h4><p>${food.score>=70?'Aman dikonsumsi. Konsumsi sebelum 23 Juli 2026.':'Segera masak, bekukan, atau buang jika kondisi visual memburuk.'}</p></span></button><button class="action-row" data-action="history"><span class="action-left">${icon('history')} Riwayat</span>${icon('chevron')}</button></div></section>`}
function inventoryScreen(){const tabs=['Semua','Kulkas','Freezer','Pantry'],filtered=state.inventoryTab==='Semua'?foods.slice(0,6):foods.filter(f=>f.location===state.inventoryTab);return `<section class="screen inventory-screen">${statusBar()}${header({title:'Inventori',rightAction:'filter',rightIcon:'filter'})}<div class="inventory-tabs">${tabs.map(t=>`<button class="tab-button ${state.inventoryTab===t?'active':''}" data-inventory-tab="${t}">${t}</button>`).join('')}</div><div class="inventory-list food-list card">${filtered.length?filtered.map(foodRow).join(''):`<div class="empty-state">Belum ada makanan di ${state.inventoryTab}.</div>`}</div>${bottomNav('inventory')}</section>`}
function notificationCard(item){return `<button class="notification-card card ${item.section==='important'?`alert-${item.tone}`:''} ${item.read?'read':''}" data-notification-id="${item.id}"><span class="notification-icon ${item.tone}">${icon(item.icon)}</span><span style="text-align:left"><span class="notification-title ${item.tone}">${item.title}</span><span class="notification-copy">${item.copy}</span></span><span class="notification-time">${item.time}</span></button>`}
function notificationsScreen(){return `<section class="screen notifications-screen">${statusBar()}${header({title:'Notifikasi',rightAction:'mark-all-read',rightIcon:'check'})}<div class="notification-content"><section class="notification-group"><div class="notification-section-title">Penting</div>${notifications.filter(n=>n.section==='important').map(notificationCard).join('')}</section><section class="notification-group"><div class="notification-section-title info">Informasi</div>${notifications.filter(n=>n.section==='info').map(notificationCard).join('')}</section></div>${bottomNav('notifications')}</section>`}
function recommendationsScreen(){const options=[{id:'eat',icon:'eat',tone:'green',title:'Segera Dikonsumsi',copy:'Makanan masih aman, sebaiknya dikonsumsi hari ini.'},{id:'cook',icon:'cook',tone:'yellow',title:'Masak Sekarang',copy:'Waktu terbaik untuk memasak makanan ini.'},{id:'freeze',icon:'snow',tone:'blue',title:'Bekukan',copy:'Simpan di freezer untuk memperpanjang kesegaran.'},{id:'discard',icon:'trash',tone:'red',title:'Buang',copy:'Makanan berisiko tinggi, sebaiknya jangan dikonsumsi.'}];return `<section class="screen no-nav recommendations-screen">${statusBar()}${header({title:'Rekomendasi',back:true})}<div class="recommend-page"><section class="recommend-intro card"><h2>Apa yang ingin kamu lakukan?</h2><p>Kami akan berikan rekomendasi terbaik berdasarkan kondisi makanan.</p><div class="recommend-illustration">Smart food storage</div></section>${options.map(o=>`<button class="recommend-option card ${state.selectedRecommendation===o.id?'selected':''}" data-recommendation="${o.id}"><span class="option-icon ${o.tone}">${icon(o.icon)}</span><span style="text-align:left"><span class="option-title">${o.title}</span><span class="option-copy">${o.copy}</span></span>${icon('chevron')}</button>`).join('')}<div class="impact-banner"><strong>Yuk, hemat bersama SafeBite!</strong>Kamu sudah menyelamatkan 2.4 kg makanan<br/>dari terbuang sia-sia 🎉</div></div></section>`}
function profileScreen(){return `<section class="screen profile-screen">${statusBar()}${header({title:'Profil & Pengaturan',back:true})}<div class="profile-page"><button class="profile-card card" data-action="edit-profile"><img class="avatar" src="${makeImage('A','#d9ecd9','#9bc8a0')}" alt="Ahsan Nurriqzi"/><span style="text-align:left"><span class="profile-name">Ahsan Nurriqzi</span><span class="profile-email">ahsan.nh@example.com</span></span>${icon('chevron')}</button><section class="profile-column"><h3 class="group-title">Perangkat Saya</h3><div class="settings-card card">${state.devices.map(d=>`<button class="settings-row" data-device="${d}">${icon('device')}<span>${d}</span><span class="connected"><i class="dot"></i>Terhubung</span></button>`).join('')}<button class="settings-row add-device" data-action="open-add-device">${icon('plus')}<span>Tambah Perangkat</span><span></span></button></div></section><section class="profile-column"><h3 class="group-title">Pengaturan</h3><div class="settings-card card"><button class="settings-row" data-action="setting-notifications">${icon('bell')}<span>Notifikasi</span>${icon('chevron')}</button><button class="settings-row" data-action="setting-units">${icon('units')}<span>Satuan</span><span class="setting-value">°C / kg ${icon('chevron')}</span></button><button class="settings-row" data-action="setting-language">${icon('globe')}<span>Bahasa</span><span class="setting-value">Indonesia ${icon('chevron')}</span></button><button class="settings-row" data-action="setting-help">${icon('help')}<span>Bantuan & FAQ</span>${icon('chevron')}</button><button class="settings-row" data-action="setting-about">${icon('info')}<span>Tentang SafeBite</span>${icon('chevron')}</button></div><button class="logout-button" data-action="logout">Keluar</button></section></div>${bottomNav('profile')}</section>`}
function render(){const screens={home:homeScreen,detail:detailScreen,inventory:inventoryScreen,notifications:notificationsScreen,recommendations:recommendationsScreen,profile:profileScreen};app.innerHTML=(screens[state.screen]||homeScreen)();window.scrollTo(0,0)}
function navigate(screen){if(state.screen!==screen)state.previousScreen=state.screen;state.screen=screen;render()}
function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
function openModal(title,html){modalTitle.textContent=title;modalContent.innerHTML=html;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
function addFoodModal(){openModal('Tambah Makanan',`<form id="add-food-form" class="form-grid"><label class="form-label">Nama makanan<input class="form-control" name="name" placeholder="Contoh: Sup Ayam" required/></label><label class="form-label">Kategori<select class="form-control" name="category"><option>Makanan matang</option><option>Daging & ikan</option><option>Sayuran</option><option>Susu</option><option>Buah</option></select></label><label class="form-label">Lokasi<select class="form-control" name="location"><option>Kulkas</option><option>Freezer</option><option>Pantry</option></select></label><label class="form-label">Tanggal disimpan<input class="form-control" name="date" type="date" value="2026-07-31"/></label><button class="primary-button" type="submit">Simpan Makanan</button></form>`)}
function addDeviceModal(){openModal('Tambah Perangkat',`<form id="add-device-form" class="form-grid"><label class="form-label">Nama perangkat<input class="form-control" name="name" placeholder="Contoh: Kulkas Dapur" required/></label><label class="form-label">Jenis perangkat<select class="form-control" name="type"><option>Kulkas</option><option>Freezer</option><option>Wadah SafeBite</option></select></label><label class="form-label">Kode perangkat<input class="form-control" name="code" placeholder="SB-XXXXXX" required/></label><button class="primary-button" type="submit">Hubungkan Perangkat</button></form>`)}
app.addEventListener('click',event=>{const screenButton=event.target.closest('[data-screen]');if(screenButton){navigate(screenButton.dataset.screen);return}const foodButton=event.target.closest('[data-food-id]');if(foodButton){state.selectedFoodId=foodButton.dataset.foodId;navigate('detail');return}const tab=event.target.closest('[data-inventory-tab]');if(tab){state.inventoryTab=tab.dataset.inventoryTab;render();return}const recommendation=event.target.closest('[data-recommendation]');if(recommendation){state.selectedRecommendation=recommendation.dataset.recommendation;const labels={eat:'Segera Dikonsumsi',cook:'Masak Sekarang',freeze:'Bekukan',discard:'Buang'};render();showToast(`Pilihan “${labels[state.selectedRecommendation]}” disimpan.`);return}const notification=event.target.closest('[data-notification-id]');if(notification){const item=notifications.find(n=>n.id===Number(notification.dataset.notificationId));item.read=!item.read;render();showToast(item.read?'Notifikasi ditandai sudah dibaca.':'Notifikasi ditandai belum dibaca.');return}const actionButton=event.target.closest('[data-action]');if(!actionButton)return;const action=actionButton.dataset.action;if(action==='back'){navigate(state.previousScreen==='detail'&&state.screen==='recommendations'?'detail':'home')}else if(action==='menu'){showToast('Menu SafeBite')}else if(action==='go-notifications'){navigate('notifications')}else if(action==='open-add-food'){addFoodModal()}else if(action==='open-add-device'){addDeviceModal()}else if(action==='mark-all-read'){notifications.forEach(n=>n.read=true);render();showToast('Semua notifikasi ditandai sudah dibaca.')}else if(action==='filter'){showToast('Pilih lokasi melalui tab Inventori.')}else if(action==='history'){showToast('Riwayat sensor 7 hari ditampilkan pada grafik.')}else if(action==='more-detail'){showToast('Opsi detail makanan')}else if(action==='logout'){showToast('Mode demo: akun tetap aktif.')}else if(action.startsWith('setting-')||action==='edit-profile'){showToast('Pengaturan demo siap digunakan.')}});
modal.addEventListener('click',e=>{if(e.target.closest('[data-close-modal]'))closeModal()});
modal.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='add-food-form'){const data=new FormData(event.target),name=data.get('name'),id=`custom-${Date.now()}`;foods.unshift({id,name,score:100,days:0,location:data.get('location'),image:makeImage(name,'#e5f5e6','#aad3af'),status:'Baru Ditambahkan',tone:'green',temperature:'4.0°C',humidity:'70%',voc:'Baseline'});closeModal();state.inventoryTab='Semua';navigate('inventory');showToast(`${name} berhasil ditambahkan.`)}if(event.target.id==='add-device-form'){const data=new FormData(event.target);state.devices.push(data.get('name'));closeModal();render();showToast(`${data.get('name')} berhasil dihubungkan.`)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body>
</html>
